version: 2

models:
  - name: fct_orders
    description: >
      Order item fact table — one row per order item with surrogate key.
      Partitioned by order_purchase_date, clustered by customer_state and
      product_category_name_english for optimal analytical query performance.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "price >= 0"
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_item_value >= 0"
          config:
            severity: warn
    columns:
      - name: order_item_key
        tests:
          - unique
          - not_null
      - name: order_purchase_date
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null
      - name: total_item_value
        tests:
          - not_null
