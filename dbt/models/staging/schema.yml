version: 2

sources:
  - name: olist_raw
    database: "{{ env_var('REDSHIFT_DB', 'olist') }}"
    schema: "{{ env_var('RS_RAW_SCHEMA', 'olist_raw') }}"
    tables:
      - name: orders_enriched
        description: >
          Denormalized Olist orders produced by PySpark. Grain: one row per order item.
          DISTKEY(customer_state), SORTKEY(order_purchase_date) for optimal query performance.

models:
  - name: stg_orders
    description: "Cleaned and typed Olist orders from the raw layer (one row per order item)"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_purchase_date
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null
      - name: total_item_value
        tests:
          - not_null
