ecommerce_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST') }}"
      user: "{{ env_var('PG_USER') }}"
      password: "{{ env_var('PG_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('PG_DB', 'olist') }}"
      schema: "{{ env_var('PG_PROD_SCHEMA', 'olist_prod') }}"
      threads: 4
      sslmode: require
